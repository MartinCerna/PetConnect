<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PetConnect</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #fff1f2 0%, #ffffff 60%, #f0f9ff 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #171717;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #f3e8ff;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(219, 39, 119, 0.12);
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 20px;
        background: #db2777;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        box-shadow: 0 10px 24px rgba(219, 39, 119, 0.28);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 800;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #525252;
      }
      a.btn {
        display: inline-block;
        width: 100%;
        padding: 13px 18px;
        border-radius: 14px;
        background: #db2777;
        color: #ffffff;
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">🐾</div>
      <h1>PetConnect</h1>
      <p>Conectando con tu panel en vivo y tus alertas de mascota...</p>
      <a class="btn" href="https://pet-connect-flame.vercel.app/dashboard?app=1">
        Reintentar conexión
      </a>
    </main>
    <script>
      setTimeout(function () {
        window.location.replace('https://pet-connect-flame.vercel.app/dashboard?app=1');
      }, 600);
    </script>
  </body>
</html>
