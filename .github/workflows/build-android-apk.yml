name: Compilar APK Android de PetConnect

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL pública de la app PetConnect en Vercel (opcional)'
        required: false
        default: 'https://pet-connect-flame.vercel.app/dashboard?app=1'

jobs:
  build-apk:
    name: Build PetConnect Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci

      - name: Sincronizar proyecto Capacitor Android
        working-directory: frontend
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || 'https://pet-connect-flame.vercel.app/dashboard?app=1' }}
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle Wrapper y compilar APK Debug
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK generado
        working-directory: frontend/android
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/PetConnect-Android.apk

      - name: Publicar PetConnect-Android.apk como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PetConnect-Android-APK
          path: frontend/android/dist-apk/PetConnect-Android.apk
          retention-days: 30
